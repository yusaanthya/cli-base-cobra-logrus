version: "2"
run:
  tests: true
linters:
  enable:
    - dupl
    - gocyclo
    - misspell
  settings:
    dupl:
      threshold: 100
    gocyclo:
      min-complexity: 15
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
